<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--ink:#f2f2f2;--card:#151515;--accent:#8c8c8c;--soft:#222;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.035) 14px 15px);color:var(--ink);font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:22px;letter-spacing:.02em;text-align:center}
.screen{display:none;min-height:100%;padding:28px 20px;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.screen.on{display:flex}
h1{font-size:36px;margin:0;line-height:1.2;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
h2{font-size:26px;margin:0;font-weight:400;text-transform:uppercase;letter-spacing:.06em;line-height:1.4}
p{margin:0;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:18px}
button{font:inherit;font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:17px;color:var(--ink);background:transparent;border:1px solid var(--accent);border-radius:0;padding:12px 34px;cursor:pointer}
button:active{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.photo{width:220px;height:270px;background:var(--card);border:1px solid var(--accent);padding:8px;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.cake{font-size:96px;line-height:1;position:relative;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(255,255,255,.12))}
.flames{display:block;font-size:44px;height:50px;letter-spacing:6px}
.flames.out{opacity:.25}
.gift{width:108px;padding:22px 8px;background:transparent;color:var(--ink);border:1px solid #3a3a3a;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:16px;letter-spacing:.12em}
.gift:active{background:var(--ink);color:var(--bg)}
.gift span{font-size:44px;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.on{display:flex}
.sheet{background:#101010;border:1px solid #3a3a3a;max-width:400px;width:100%;max-height:85%;overflow:auto;padding:38px 30px;display:flex;flex-direction:column;gap:26px;align-items:center}
.letter{white-space:pre-line;text-align:left;font-size:20px;font-weight:300;line-height:1.8;letter-spacing:.01em}
.cake.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-4deg)}55%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.smoke{position:absolute;top:-6px;font-size:26px;opacity:0;animation:rise 1.8s ease-out forwards}
@keyframes rise{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-90px) scale(1.6)}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
#yay.show{animation:yayin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes yayin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cake.pop,.smoke,.conf,#yay.show{animation:none}.conf,.smoke{display:none}}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:20;padding:6px 12px;font-size:18px;letter-spacing:0;border-radius:0;background:rgba(0,0,0,.5)}
#mute.off{opacity:.5;text-decoration:line-through}
</style>
</head>
<body>

<section class="screen on" id="s0">
  <div class="photo" id="photo">🎂</div>
  <h1>Happy Birthday,<br><span id="nm"></span>!</h1>
  <p>I made something for you.</p>
  <button onclick="startMusic();go('s1')">Open</button>
</section>

<section class="screen" id="s1">
  <h2>Blow out the candles!</h2>
  <div class="cake" id="cake" onclick="blow()" role="button" tabindex="0" aria-label="Blow out the candles">
    <span class="flames" id="fl">🕯️🕯️🕯️🕯️</span>🎂
  </div>
  <p id="hint">Tap the cake</p>
  <h1 id="yay" hidden>Yay! Happy Birthday!</h1>
  <button id="next1" hidden onclick="go('s2')">Next</button>
</section>

<section class="screen" id="s2">
  <h2 id="q">Accept your gifts?</h2>
  <div style="font-size:84px;line-height:1">🎁</div>
  <div class="row">
    <button id="yes" onclick="go('s3')">Yes</button>
    <button id="no" onclick="nope()">No</button>
  </div>
  <button id="ok" hidden onclick="again()">Okay</button>
</section>

<section class="screen" id="s3">
  <h2>Yay! Choose your gift</h2>
  <div class="row">
    <button class="gift" onclick="openGift('letter')"><span>✉️</span>Gift 1</button>
    <button class="gift" onclick="openGift('flowers')"><span>📸</span>Gift 2</button>
    <button class="gift" onclick="openGift('surprise')"><span>🎁</span>Gift 3</button>
  </div>
  <p>Open all three</p>
</section>

<div class="modal" id="m" onclick="if(event.target===this)closeM()">
  <div class="sheet" id="sheet"></div>
</div>

es goes on …\nPeople  came and leave with a meaningful msg for u \n😔but i guess i never wanted u to be a lesson for me🙃\n\n👋 hey, wrote smthg for you\n\nHis smile was hiding secrets, I dared to know more about.\nTired looking eyes.\nEyes that crave affection, but the love is lost They were not matching his soft, heart-warming smile whilst not meeting mine.\nA smile played on his heart shaped lips each time we locked our eyes.\nAt that precise moment time stopped in a collision of senses, the outside world got blurry as if we were the only ones whose existence is known. Among 7.9 billion people his smile\n\nYooo boyy😮‍💨\nHe Isn't Mine\nI once loved a boy, he felt so near, Now he's a stranger, no longer here. He laughs with her, his hand in hers, While I stand quiet, with thoughts that stir.\nSometimes I feel the jealous ache, A wish, a dream I cannot take. She gets the boy I dreamed about, The one I thought I'd figured out.\nBut love has wings, it flies away, It finds new hearts, it cannot stay(thats not entirely true , love is the purest form of the emotion). I tell myself, \"He isn't mine, His story's gone, not part of mine.\"\nSo I let go, though it breaks me through, And learn to love what waits, what's new.\n\n\nMiss you!\n\nI like the version of us nobody else sees...\nHow we talk, how we joke, how we disappear into our own little world without trying to please anyone.\nHow there are parts of me only you understand and parts of you that only I get to keep a secret.\nI like that when I'm with you, everything slows down... be it the people, the noise, the expectations or the entire World, everything just fades away and all that's left is us choosing each other in the natural, most unique way.\n\nWhy do I like you..?(the question you asked thousands of time )\nI don't have an answer for that, but I guess it's just the vibes you give me, the smiles you put on my face, the laughs I get from talking to you, and just the fact that you can make me think of you even if document.getElementById('nm').textContent = CONFIG.name;
if (CONFIG.photo) document.getElementById('photo').innerHTML = '<img alt="" src="' + CONFIG.photo + '">';
var music=false;
function startMusic(){
  var a=document.getElementById('bgm');
  try{a.volume=0.6;var p=a.play();if(p&&p.catch)p.catch(function(){});music=true;
  var b=document.getElementById('mute');b.hidden=false;b.classList.remove('off')}catch(e){}
}
function toggleMusic(){
  var a=document.getElementById('bgm'),b=document.getElementById('mute');
  try{if(a.paused){a.play();b.classList.remove('off')}else{a.pause();b.classList.add('off')}}catch(e){}
}
function go(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});document.getElementById(id).classList.add('on')}
var blown=false;
function blow(){
  if(blown)return;blown=true;
  document.getElementById('fl').classList.add('out');
  document.getElementById('hint').hidden=true;
  document.getElementById('yay').hidden=false;
  document.getElementById('next1').hidden=false;
  celebrate();
}
document.getElementById('cake').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')blow()});
function celebrate(){
  var c=document.getElementById('cake');
  c.classList.add('pop');
  for(var i=0;i<4;i++){var s=document.createElement('span');s.className='smoke';s.textContent='💨';s.style.left=(18+i*20)+'%';s.style.animationDelay=(i*0.12)+'s';c.appendChild(s)}
  var y=document.getElementById('yay');y.classList.add('show');
  var cols=['#111','#fff','#888','#bbb','#444','#ddd'];
  for(var j=0;j<70;j++){
    var d=document.createElement('div');d.className='conf';
    d.style.left=Math.random()*100+'vw';
    d.style.background=cols[j%cols.length];
    d.style.border='1px solid #888';
    d.style.setProperty('--dx',(Math.random()*160-80)+'px');
    d.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    d.style.animationDuration=(2.2+Math.random()*2)+'s';
    d.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(d);
    setTimeout(function(e){e.remove()},5500,d);
  }
}
function nope(){
  document.getElementById('q').textContent='Yes, that’s right! I am your biggest and blessed gift ever given to you 😘';
  document.getElementById('yes').hidden=true;document.getElementById('no').hidden=true;
  document.getElementById('ok').hidden=false;
}
function again(){
  document.getElementById('q').textContent='Accept your gifts?';
  document.getElementById('yes').hidden=false;document.getElementById('no').hidden=false;
  document.getElementById('ok').hidden=true;
}
function esc(t){return t.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function openGift(k){
  var h='';
  if(k==='letter')h='<div class="letter">'+esc(CONFIG.letter)+'</div>';
  if(k==='flowers')h='<h2>'+esc(CONFIG.flowersNote)+'</h2>'+[CONFIG.photo].concat(CONFIG.photos).map(function(s,i){return '<img alt="" src="'+s+'" style="width:170px;max-width:42vw;border:1px solid #444;padding:6px;background:#111">'}).join('');
  if(k==='surprise')h='<div class="letter" style="font-size:17px;line-height:1.75">'+esc(CONFIG.surprise)+'</div>';
  document.getElementById('sheet').innerHTML=h+'<button onclick="closeM()">Close</button>';
  document.getElementById('m').classList.add('on');
}
function closeM(){document.getElementById('m').classList.remove('on')}
